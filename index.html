<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONITORING CNG GACOAN</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1220'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' font-family='Arial' font-weight='900' font-size='28' fill='%2300ffb0'%3ECNG%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1220;color:#fff;font-family:Consolas,Arial;padding:10px}
.card{background:#111d33;border:1px solid #1e2f5a;border-radius:12px;padding:14px;margin-bottom:12px}
label{font-size:11px;color:#7aa0d6;font-weight:bold}input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #2a3f6e;background:#0a1220;color:#fff;margin-top:5px}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:8px}
.btn-save{background:#00ffb0;color:#000}.btn-update{background:#ffca28;color:#000}.btn-cancel{background:#333;color:#fff;display:none}
.btn-pdf{background:linear-gradient(90deg,#ffca28,#ff8c00);color:#000}
table{width:100%;border-collapse:collapse;margin-top:10px}th{background:#ff4d4d;padding:10px;font-size:10px}td{padding:10px;border-bottom:1px solid #1e2f5a;font-size:12px;text-align:center}
.aksi{display:flex;gap:5px;justify-content:center}
.b-edit{background:#ffca28;color:#000;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:11px}
.b-hapus{background:#ff4444;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:11px}
.mode-edit{outline:2px solid #ffca28;box-shadow:0 0 20px rgba(255,202,40,.3)}
</style>
</head>
<body>

<div class="card" id="cardForm">
<div style="display:flex;justify-content:space-between"><b style="color:#00ffb0">FORM INPUT CNG</b><span style="font-size:10px">● SYNC LIVE</span></div>
<div id="lblEdit" style="display:none;color:#ffca28;text-align:center;font-weight:bold;margin-top:8px;font-size:12px">MODE EDIT AKTIF</div>
<label>TEKANAN / FLOW (contoh: 0,9)</label><input id="f_flow" value="0,9">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div><label>KETERANGAN (NAMA)</label><input id="f_ket" placeholder="SUSANTI / AQIL"></div>
<div><label>HARGA / SM³</label><input id="f_harga" type="number" value="12000"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div><label>METER AWAL / FAKTOR (contoh: 28)</label><input id="f_faktor" value="28"></div>
<div><label>FOTO (opsional)</label><select id="f_foto"><option>-</option><option>Ada Foto</option></select></div>
</div>
<button class="btn btn-save" id="btnSimpan" onclick="simpanData()">SIMPAN DATA 🚀</button>
<button class="btn btn-cancel" id="btnBatal" onclick="batalEdit()">BATAL EDIT ✖️</button>
<canvas id="chartCNG" height="130" style="margin-top:15px"></canvas>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;font-size:12px"><b>DATA TERSIMPAN: <span id="jmlData">0 data</span></b><span id="infoSync" style="color:#7aa0d6"></span></div>
<button class="btn btn-pdf" onclick="exportPDF()">📄 PDF + Harga (FIX)</button>
<div style="overflow:auto">
<table>
<thead><tr><th>TOTAL SM³</th><th>HARGA</th><th>TOTAL HARGA</th><th>KETERANGAN</th><th>FOTO</th><th>AKSI</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<button class="btn" style="background:#2a1a1a;color:#ff6b6b;border:1px solid #ff4444;margin-top:10px" onclick="hapusSemua()">🗑️ Hapus Semua (Sync All)</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// GANTI DENGAN CONFIG ASLI PUNYA LU BRO - BIAR SYNC LIVE JALAN
const firebaseConfig = {
  apiKey: "AIzaSyXXXX-GANTI-PUNYA-LU",
  authDomain: "cng-gacoan.firebaseapp.com",
  databaseURL: "https://cng-gacoan-default-rtdb.firebaseio.com",
  projectId: "cng-gacoan",
  storageBucket: "cng-gacoan.appspot.com",
  messagingSenderId: "123456",
  appId: "1:123:web:xxxx"
};
let db; try{ const app=initializeApp(firebaseConfig); db=getDatabase(app);}catch(e){console.log('offline mode')}

let dataList = JSON.parse(localStorage.getItem('cng_gacoan_final')||'[]');
let editIdx = null; // === INI KUNCI EDIT PER DATA ===
let chartObj;

function rumusAsli(flow, faktor){
  // DARI FOTO LU: 0,9 * 28 = 94.10 SM³
  // Jadi flow * faktor * 3.734126984126984 = 94.10
  return flow * faktor * 3.734126984;
}

window.simpanData = function(){
  let flowStr = document.getElementById('f_flow').value.replace(',','.');
  let flow = parseFloat(flowStr)||0;
  let faktor = parseFloat(document.getElementById('f_faktor').value)||0;
  let ket = document.getElementById('f_ket').value.toUpperCase()||'TANPA NAMA';
  let harga = parseInt(document.getElementById('f_harga').value)||12000;
  let foto = document.getElementById('f_foto').value;
  if(flow==0){alert('Isi flow dulu bro!');return}
  let totalSM = rumusAsli(flow,faktor);
  let totalHarga = Math.round(totalSM*harga);
  let obj = {flow:flowStr,faktor:document.getElementById('f_faktor').value,total_sm:totalSM.toFixed(2),harga,total_harga:totalHarga,keterangan:ket,foto,tgl:new Date().toLocaleDateString('id-ID')};

  // === LOGIKA EDIT & HAPUS PER DATA - INI TAMBAHANNYA ===
  if(editIdx !== null){
    dataList[editIdx] = obj;
    editIdx = null;
  }else{
    dataList.push(obj);
  }
  simpanCloud();
}

function simpanCloud(){
  localStorage.setItem('cng_gacoan_final',JSON.stringify(dataList));
  if(db){ set(ref(db,'cng_gacoan'), dataList); }
  render(); batalEdit();
}

window.render = function(){
  document.getElementById('jmlData').innerText = dataList.length+' data';
  let tb = document.getElementById('tbody');
  tb.innerHTML='';
  if(dataList.length==0){tb.innerHTML='<tr><td colspan="6" style="color:#666">Belum ada data</td></tr>'; return}
  dataList.slice().reverse().forEach((it, rev)=>{
    let i = dataList.length-1-rev;
    tb.innerHTML += `<tr>
      <td style="color:#00ffb0;font-weight:bold">${it.total_sm} SM³</td>
      <td>Rp ${Number(it.harga).toLocaleString('id-ID')}</td>
      <td style="color:#ffca28;font-weight:bold">Rp ${Number(it.total_harga).toLocaleString('id-ID')}</td>
      <td>${it.keterangan}</td>
      <td>${it.foto}</td>
      <td><div class="aksi">
        <button class="b-edit" onclick="editData(${i})">✏️ Edit</button>
        <button class="b-hapus" onclick="hapusSatu(${i})">🗑️ Hapus</button>
      </div></td>
    </tr>`;
  });
  drawChart();
}

// === FUNGSI BARU: EDIT PER DATA ===
window.editData = function(i){
  editIdx = i;
  let it = dataList[i];
  document.getElementById('f_flow').value = it.flow;
  document.getElementById('f_faktor').value = it.faktor;
  document.getElementById('f_ket').value = it.keterangan;
  document.getElementById('f_harga').value = it.harga;
  document.getElementById('f_foto').value = it.foto;
  document.getElementById('btnSimpan').innerText = 'UPDATE DATA '+it.keterangan+' ✏️';
  document.getElementById('btnSimpan').className = 'btn btn-update';
  document.getElementById('btnBatal').style.display = 'block';
  document.getElementById('lblEdit').style.display = 'block';
  document.getElementById('lblEdit').innerText = 'MODE EDIT: '+it.keterangan+' - '+it.total_sm+' SM³ (Baris '+(i+1)+')';
  document.getElementById('cardForm').classList.add('mode-edit');
  window.scrollTo({top:0,behavior:'smooth'});
}

// === FUNGSI BARU: HAPUS PER DATA ===
window.hapusSatu = function(i){
  if(confirm('Yakin hapus data '+dataList[i].keterangan+' - '+dataList[i].total_sm+' SM³ ?')){
    dataList.splice(i,1);
    simpanCloud();
  }
}

window.batalEdit = function(){
  editIdx=null;
  document.getElementById('btnSimpan').innerText='SIMPAN DATA 🚀';
  document.getElementById('btnSimpan').className='btn btn-save';
  document.getElementById('btnBatal').style.display='none';
  document.getElementById('lblEdit').style.display='none';
  document.getElementById('cardForm').classList.remove('mode-edit');
}

window.hapusSemua = function(){
  if(confirm('Hapus SEMUA data? Semua laptop ikut kehapus!')){ dataList=[]; simpanCloud(); }
}

function drawChart(){
  let ctx=document.getElementById('chartCNG');
  if(chartObj) chartObj.destroy();
  chartObj = new Chart(ctx,{
    type:'bar',
    data:{labels:dataList.map(d=>d.keterangan),datasets:[{label:'SM³',data:dataList.map(d=>d.total_sm),backgroundColor:'#00ffb0'}]},
    options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
  });
}

window.exportPDF = function(){ window.print(); }

if(db){ onValue(ref(db,'cng_gacoan'), s=>{ if(s.val()){ dataList=s.val(); localStorage.setItem('cng_gacoan_final',JSON.stringify(dataList)); render(); document.getElementById('infoSync').innerText='LIVE SYNC '+new Date().toLocaleTimeString(); } }); }

render();
</script>
</body>
</html>
