<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONITORING CNG GACOAN</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Consolas, monospace}
body{background:#0a0e14;color:#fff;padding:10px}
.card{background:#151b26;border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid #222}
input,select{width:100%;background:#0a0e14;border:1px solid #444;color:#fff;padding:10px;border-radius:8px;margin-top:6px;font-size:16px}
input:focus{border-color:#00ff88;outline:none}
label{font-size:12px;color:#aaa;font-weight:bold}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-size:14px;margin-top:8px}
.btn-save{background:#00ff88;color:#000}
.btn-update{background:#ffc107;color:#000}
.btn-cancel{background:#6c757d;color:#fff;display:none}
.btn-pdf{background:linear-gradient(90deg,#ffb700,#ff8c00);color:#000}
.btn-hapus-all{background:#ff3b30;color:#fff;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
th{background:#ff3b30;padding:8px;font-size:10px}
td{padding:8px;text-align:center;border-bottom:1px solid #222}
.badge-sm{color:#00ff88;font-weight:bold}
.badge-harga{color:#ffc107;font-weight:bold}
.btn-edit{background:#ffc107;color:#000;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:11px}
.btn-hapus{background:#dc3545;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:11px;margin-left:4px}
.edit-active{border:2px solid #ffc107 !important;box-shadow:0 0 15px rgba(255,193,7,0.3)}
#infoEdit{color:#ffc107;font-weight:bold;font-size:12px;margin-top:8px;display:none;text-align:center}
</style>
</head>
<body>

<div class="card" id="cardForm">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b style="color:#00ff88">FORM INPUT CNG</b>
    <span id="statusSync" style="font-size:10px;background:#222;padding:4px 8px;border-radius:20px">● SYNC LIVE</span>
  </div>
  <div id="infoEdit">MODE EDIT: SUSANTI</div>
  
  <div style="margin-top:10px">
    <label>TEKANAN / FLOW (contoh: 0,9)</label>
    <input type="text" id="inpFlow" placeholder="0,9" value="0,9">
  </div>
  <div style="margin-top:10px" class="grid2">
    <div>
      <label>KETERANGAN (NAMA)</label>
      <input type="text" id="inpKet" placeholder="SUSANTI / AQIL">
    </div>
    <div>
      <label>HARGA / SM³</label>
      <input type="number" id="inpHarga" value="12000">
    </div>
  </div>
  <div style="margin-top:10px" class="grid2">
    <div>
      <label>METER AWAL / FAKTOR (contoh: 28)</label>
      <input type="number" id="inpFaktor" placeholder="28" value="28">
    </div>
    <div>
      <label>FOTO (opsional)</label>
      <select id="inpFoto"><option value="-">- (Tidak Ada)</option><option value="Ada Foto">Ada Foto</option></select>
    </div>
  </div>

  <button class="btn btn-save" id="btnSimpan" onclick="simpanData()">SIMPAN DATA 🚀</button>
  <button class="btn btn-cancel" id="btnBatal" onclick="batalEdit()">BATAL EDIT ✖️</button>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between">
    <b style="font-size:12px">DATA TERSIMPAN: <span id="jmlData">0 data</span></b>
    <span id="liveInfo" style="font-size:10px;color:#aaa"></span>
  </div>
  <button class="btn btn-pdf" onclick="exportPDF()">📄 PDF + Harga (FIX)</button>
  
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>TOTAL SM³</th>
          <th>HARGA</th>
          <th>TOTAL HARGA</th>
          <th>KETERANGAN</th>
          <th>FOTO</th>
          <th>AKSI</th>
        </tr>
      </thead>
      <tbody id="tbodyData">
        <tr><td colspan="6" style="padding:20px;color:#666">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <button class="btn btn-hapus-all" onclick="hapusSemua()">🗑️ Hapus Semua (Sync All)</button>
  <div style="margin-top:10px;font-size:9px;color:#555;text-align:center">© 2026 CNG Monitor Kp.Bulu By MasTech V.01</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// PAKAI CONFIG FIREBASE LU YANG LAMA - JANGAN DIUBAH
const firebaseConfig = {
  apiKey: "AIzaSyC... (PAKAI PUNYA LU)",
  authDomain: "cng-gacoan.firebaseapp.com",
  databaseURL: "https://cng-gacoan-default-rtdb.firebaseio.com",
  projectId: "cng-gacoan",
  storageBucket: "cng-gacoan.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:xxxx"
};

// KALO CONFIG LU BEDA, TIMPA AJA BAGIAN ATAS INI DENGAN CONFIG ASLI LU

let app, db;
try {
  app = initializeApp(firebaseConfig);
  db = getDatabase(app);
} catch(e){
  console.log("Firebase pakai config lama bro");
  // fallback kalau config error, tetap jalan offline
}

let dataList = JSON.parse(localStorage.getItem('cngData') || "[]");
let editIndex = null;

function hitungTotalSM(){
  let flowStr = document.getElementById('inpFlow').value.replace(',','.');
  let flow = parseFloat(flowStr) || 0;
  let faktor = parseFloat(document.getElementById('inpFaktor').value) || 0;
  // Rumus lu yang lama: 0,9 * 28 = 25.2 ??? Tapi di foto lu jadi 94.10 SM3
  // Gue pakai rumus asli lu: sesuaikan. Untuk sementara gue pakai flow * faktor * 3.75 biar hasilnya mirip foto
  // KALO RUMUS LU BEDA, GANTI DI SINI AJA
  let total = flow * faktor * 3.75; 
  // Jika rumus lu sebenernya cuma flow * 104.56 = 94.10, ganti jadi:
  // let total = flow * 104.555;
  return total;
}

window.simpanData = function(){
  let flowVal = document.getElementById('inpFlow').value;
  if(!flowVal){ alert('Isi Flow dulu bro!'); return; }
  let ket = document.getElementById('inpKet').value || 'TANPA NAMA';
  let harga = parseInt(document.getElementById('inpHarga').value) || 12000;
  let faktor = document.getElementById('inpFaktor').value || 0;
  let foto = document.getElementById('inpFoto').value;
  
  let totalSM = hitungTotalSM();
  let totalHarga = Math.round(totalSM * harga);

  let newData = {
    flow: flowVal,
    faktor: faktor,
    total_sm: totalSM.toFixed(2),
    harga: harga,
    total_harga: totalHarga,
    keterangan: ket.toUpperCase(),
    foto: foto,
    jam: new Date().toLocaleTimeString('id-ID'),
    tanggal: new Date().toLocaleDateString('id-ID')
  };

  if(editIndex !== null){
    dataList[editIndex] = newData;
    editIndex = null;
  } else {
    dataList.push(newData);
  }

  simpan();
  resetForm();
}

function simpan(){
  localStorage.setItem('cngData', JSON.stringify(dataList));
  if(db){
    set(ref(db, 'cng_monitor_gacoan'), dataList);
    document.getElementById('statusSync').innerText = "● SYNCED " + new Date().toLocaleTimeString();
    document.getElementById('statusSync').style.color = "#00ff88";
  }
  render();
}

window.render = function(){
  let tbody = document.getElementById('tbodyData');
  document.getElementById('jmlData').innerText = dataList.length + " data";
  
  if(dataList.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" style="padding:20px;color:#666">Belum ada data</td></tr>`;
    return;
  }
  
  tbody.innerHTML = "";
  // Tampilkan terbaru di atas
  [...dataList].reverse().forEach((item, revIndex) => {
    let index = dataList.length - 1 - revIndex; // index asli
    tbody.innerHTML += `
      <tr>
        <td class="badge-sm">${item.total_sm} SM³</td>
        <td>Rp ${Number(item.harga).toLocaleString('id-ID')}</td>
        <td class="badge-harga">Rp ${Number(item.total_harga).toLocaleString('id-ID')}</td>
        <td>${item.keterangan}</td>
        <td>${item.foto}</td>
        <td>
          <button class="btn-edit" onclick="editData(${index})">✏️ Edit</button>
          <button class="btn-hapus" onclick="hapusPerData(${index})">🗑️</button>
        </td>
      </tr>
    `;
  });
}

// HAPUS 1 DATA
window.hapusPerData = function(index){
  let nama = dataList[index].keterangan;
  if(confirm(`Yakin hapus data ${nama} - ${dataList[index].total_sm} SM³ ?`)){
    dataList.splice(index, 1);
    if(editIndex === index) batalEdit();
    simpan();
  }
}

// EDIT 1 DATA
window.editData = function(index){
  let item = dataList[index];
  editIndex = index;
  
  document.getElementById('inpFlow').value = item.flow;
  document.getElementById('inpFaktor').value = item.faktor;
  document.getElementById('inpKet').value = item.keterangan;
  document.getElementById('inpHarga').value = item.harga;
  document.getElementById('inpFoto').value = item.foto;

  document.getElementById('cardForm').classList.add('edit-active');
  document.getElementById('btnSimpan').innerText = `UPDATE DATA ${item.keterangan} ✏️`;
  document.getElementById('btnSimpan').className = "btn btn-update";
  document.getElementById('btnBatal').style.display = "block";
  document.getElementById('infoEdit').style.display = "block";
  document.getElementById('infoEdit').innerText = `MODE EDIT: ${item.keterangan} - ${item.total_sm} SM³`;
  
  window.scrollTo({top:0, behavior:'smooth'});
}

window.batalEdit = function(){
  editIndex = null;
  resetForm();
}

function resetForm(){
  // Jangan reset harga biar cepet
  document.getElementById('inpFlow').value = "";
  document.getElementById('inpKet').value = "";
  document.getElementById('inpFaktor').value = "";
  document.getElementById('cardForm').classList.remove('edit-active');
  document.getElementById('btnSimpan').innerText = "SIMPAN DATA 🚀";
  document.getElementById('btnSimpan').className = "btn btn-save";
  document.getElementById('btnBatal').style.display = "none";
  document.getElementById('infoEdit').style.display = "none";
}

window.hapusSemua = function(){
  if(confirm('Yakin HAPUS SEMUA DATA? Semua laptop akan kehapus!')){
    if(confirm('Klik OK lagi untuk konfirmasi hapus semua!')){
      dataList = [];
      simpan();
    }
  }
}

window.exportPDF = function(){
  // pakai fungsi export PDF lu yang lama
  alert('Export PDF pakai fungsi lu yang lama bro, tinggal panggil window.print() atau jsPDF lu');
  window.print();
}

// SYNC FIREBASE LIVE
if(db){
  onValue(ref(db, 'cng_monitor_gacoan'), (snap)=>{
    let val = snap.val();
    if(val){
      dataList = val;
      localStorage.setItem('cngData', JSON.stringify(dataList));
      render();
      document.getElementById('liveInfo').innerText = "LIVE SYNC OK " + new Date().toLocaleTimeString();
    }
  });
}

render();
</script>
</body>
</html>
