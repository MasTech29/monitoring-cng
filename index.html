<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONITORING CNG KP BULU - LIVE SYNC v17 FINAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:'JetBrains Mono',monospace;background:#020617;color:#e2e8f0}
.orbitron{font-family:'Orbitron',sans-serif}
.glass{background:rgba(15,23,42,0.8);backdrop-filter:blur(12px);border:1px solid rgba(51,65,85,0.5)}
.live-dot{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body class="min-h-screen p-2 md:p-4">
<div class="max-w-[1600px] mx-auto">
<div class="glass rounded-2xl p-4 mb-4 flex flex-wrap justify-between items-center">
<div>
<h1 class="orbitron text-xl md:text-3xl font-bold text-cyan-400">MONITORING CNG KP BULU</h1>
<p class="text-xs text-slate-400">LIVE SYNC • Firebase Realtime • v17 FINAL • cng-kpbulu</p>
</div>
<div class="flex items-center gap-3">
<div class="flex items-center gap-2 bg-slate-900 px-3 py-2 rounded-full border border-slate-700">
<div id="liveIndicator" class="w-2 h-2 bg-red-500 rounded-full live-dot"></div>
<span id="liveStatus" class="text-xs font-bold">CONNECTING...</span>
</div>
<span id="lastSync" class="text-[10px] text-slate-500"></span>
</div>
</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
<div class="glass rounded-xl p-3 text-center"><p class="text-[10px] text-slate-400">TOTAL TRAILER</p><p id="kpiTrailer" class="text-2xl font-bold text-white">0</p></div>
<div class="glass rounded-xl p-3 text-center"><p class="text-[10px] text-slate-400">AVG PRESSURE</p><p id="kpiPress" class="text-2xl font-bold text-cyan-400">0 PSI</p></div>
<div class="glass rounded-xl p-3 text-center"><p class="text-[10px] text-slate-400">ONLINE UNIT</p><p id="kpiOnline" class="text-2xl font-bold text-emerald-400">0</p></div>
<div class="glass rounded-xl p-3 text-center"><p class="text-[10px] text-slate-400">LAST UPDATE</p><p id="kpiTime" class="text-xs font-bold text-white">-</p></div>
</div>

<div class="glass rounded-2xl p-4 mb-4">
<h2 class="orbitron text-sm font-bold text-amber-400 mb-3">+ INPUT DATA TRAILER (Auto Sync Semua Laptop)</h2>
<div class="grid grid-cols-2 md:grid-cols-6 gap-3">
<input id="inNo" placeholder="No. Polisi / ID" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
<input id="inPress" type="number" placeholder="Pressure PSI" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
<input id="inVol" type="number" placeholder="Volume m3" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
<select id="inStatus" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
<option value="ONLINE">ONLINE</option>
<option value="OFFLINE">OFFLINE</option>
<option value="MAINTENANCE">MAINTENANCE</option>
<option value="EMPTY">EMPTY</option>
</select>
<input id="inLoc" placeholder="Lokasi" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
<button onclick="addData()" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-lg px-4 py-2 text-sm">SIMPAN & SYNC 🚀</button>
</div>
</div>

<div class="glass rounded-2xl p-3 overflow-x-auto">
<table class="w-full text-sm">
<thead><tr class="text-[10px] text-slate-400 border-b border-slate-700"><th class="text-left p-2">NO</th><th class="text-left p-2">POLISI / ID</th><th class="text-left p-2">PRESSURE</th><th class="text-left p-2">VOLUME</th><th class="text-left p-2">STATUS</th><th class="text-left p-2">LOKASI</th><th class="text-left p-2">WAKTU</th><th class="text-left p-2">AKSI</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7Ec-_5C-eVXVzUhQxxNgyHU2WCUHE2sA",
  authDomain: "cng-kpbulu.firebaseapp.com",
  databaseURL: "https://cng-kpbulu-default-rtdb.firebaseio.com",
  projectId: "cng-kpbulu",
  storageBucket: "cng-kpbulu.firebasestorage.app",
  messagingSenderId: "976465353369",
  appId: "1:976465353369:web:4a26d31dbb2bc6e13a3608",
  measurementId: "G-8BK9M7W0Y2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dataRef = ref(db, 'monitoring/cng-kpbulu');

function updateUI(dataObj){
  const list = dataObj ? Object.entries(dataObj).map(([key,val])=>({key,...val})).sort((a,b)=>b.timestamp-a.timestamp) : [];
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  let totalPress = 0, online = 0;
  list.forEach((item,idx)=>{
    totalPress+= Number(item.pressure||0);
    if(item.status==='ONLINE') online++;
    const color = item.status==='ONLINE'?'text-emerald-400':item.status==='OFFLINE'?'text-red-400':item.status==='EMPTY'?'text-slate-400':'text-amber-400';
    tbody.innerHTML += `<tr class="border-b border-slate-800/50 hover:bg-slate-800/30"><td class="p-2">${idx+1}</td><td class="p-2 font-bold text-cyan-300">${item.nopol}</td><td class="p-2">${item.pressure} PSI</td><td class="p-2">${item.volume} m3</td><td class="p-2 font-bold ${color}">${item.status}</td><td class="p-2">${item.lokasi}</td><td class="p-2 text-[11px] text-slate-400">${item.waktu}</td><td class="p-2"><button onclick="delData('${item.key}')" class="bg-red-500/20 text-red-400 px-2 py-1 rounded text-xs">Hapus</button></td></tr>`;
  });
  document.getElementById('kpiTrailer').innerText = list.length;
  document.getElementById('kpiPress').innerText = list.length? Math.round(totalPress/list.length)+' PSI':'0 PSI';
  document.getElementById('kpiOnline').innerText = online;
  document.getElementById('kpiTime').innerText = new Date().toLocaleTimeString('id-ID');
  document.getElementById('lastSync').innerText = 'Sync: '+new Date().toLocaleTimeString('id-ID');
}

onValue(dataRef, (snap)=>{
  document.getElementById('liveIndicator').className='w-2 h-2 bg-emerald-500 rounded-full live-dot';
  document.getElementById('liveStatus').innerText='LIVE SYNC AKTIF';
  document.getElementById('liveStatus').className='text-xs font-bold text-emerald-400';
  updateUI(snap.val());
});

window.addData = async ()=>{
  const nopol = document.getElementById('inNo').value.trim();
  const pressure = document.getElementById('inPress').value;
  const volume = document.getElementById('inVol').value;
  const status = document.getElementById('inStatus').value;
  const lokasi = document.getElementById('inLoc').value.trim()||'KP BULU';
  if(!nopol||!pressure){alert('Isi No Polisi & Pressure!');return;}
  const waktu = new Date().toLocaleString('id-ID');
  const newRef = push(dataRef);
  await set(newRef, {nopol, pressure, volume, status, lokasi, waktu, timestamp: Date.now()});
  document.getElementById('inNo').value='';document.getElementById('inPress').value='';document.getElementById('inVol').value='';
};

window.delData = async (key)=>{
  if(!confirm('Hapus data ini di semua laptop?'))return;
  await remove(ref(db, 'monitoring/cng-kpbulu/'+key));
};
</script>
</body>
</html>
