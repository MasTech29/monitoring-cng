<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONITORING CNG GACOAN</title>
<style>
/* ... style lu yang lama biarin ... */
.btn-edit{background:#FFC107;color:#000;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;font-weight:bold;margin-right:4px}
.btn-hapus{background:#DC3545;color:#fff;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;font-weight:bold}
.btn-edit:hover{opacity:0.8}
.btn-hapus:hover{opacity:0.8}
.edit-mode{border:2px solid #FFC107 !important; background:#FFF8DC !important;}
</style>
</head>
<body>
<!-- FORM ATAS LU (0,9 dan 28) -->
<!-- ... form lu yang lama ... -->

<button id="btnSimpan" onclick="addData()" style="width:100%; background:#00FF00; padding:15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">
SIMPAN DATA 🚀
</button>
<button id="btnBatal" onclick="batalEdit()" style="display:none; width:100%; background:#6c757d; color:#fff; padding:10px; margin-top:8px; border:none; border-radius:8px; cursor:pointer;">
BATAL EDIT
</button>

<!-- TABEL -->
<table style="width:100%; margin-top:20px; border-collapse:collapse; color:#fff;">
<thead style="background:red;">
<tr>
<th>TOTAL SM³</th>
<th>HARGA</th>
<th>TOTAL HARGA</th>
<th>KETERANGAN</th>
<th>FOTO</th>
<th>AKSI</th> <!-- TAMBAHAN BARU -->
</tr>
</thead>
<tbody id="tbodyData"></tbody>
</table>

<button onclick="hapusSemua()" style="background:red; width:100%; margin-top:10px; padding:10px; border:none; color:#fff; border-radius:5px; cursor:pointer;">
🗑️ Hapus Semua (Sync All)
</button>

<script type="module">
// ... firebase config lu yang lama ...
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = { /* config lu */ };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let dataList = [];
let editIndex = null; // <--- VARIABEL BARU UNTUK EDIT

window.addData = function() {
  // ambil value dari form lu
  let totalSm = parseFloat(document.querySelectorAll('input')[0].value) || 0; // contoh 0,9
  let harga = 12000; // contoh
  let ket = document.querySelector('input[keterangan]')?.value || 'SUSANTI'; // sesuaikan

  // hitung total
  let totalHarga = totalSm * harga; // sesuaikan rumus lu

  let newData = {
    total_sm: totalSm,
    harga: harga,
    total_harga: totalHarga,
    keterangan: ket,
    foto: '-',
    tanggal: new Date().toLocaleString()
  };

  if(editIndex !== null){
    // MODE UPDATE
    dataList[editIndex] = newData;
    editIndex = null;
    document.getElementById('btnSimpan').innerText = "SIMPAN DATA 🚀";
    document.getElementById('btnSimpan').style.background = "#00FF00";
    document.getElementById('btnBatal').style.display = "none";
  } else {
    // MODE TAMBAH BARU
    dataList.push(newData);
  }
  
  simpanKeFirebase();
  resetForm();
}

function simpanKeFirebase(){
  set(ref(db, 'cng_monitor'), dataList);
}

window.renderTable = function(){
  let tbody = document.getElementById('tbodyData');
  tbody.innerHTML = "";
  dataList.forEach((item, index) => {
    tbody.innerHTML += `
      <tr style="border-bottom:1px solid #333; text-align:center;">
        <td style="color:#00FF00; font-weight:bold;">${item.total_sm} SM³</td>
        <td>Rp ${item.harga.toLocaleString('id-ID')}</td>
        <td style="color:#FFC107; font-weight:bold;">Rp ${item.total_harga.toLocaleString('id-ID')}</td>
        <td>${item.keterangan}</td>
        <td>${item.foto || '-'}</td>
        <td>
          <button class="btn-edit" onclick="editData(${index})">✏️ Edit</button>
          <button class="btn-hapus" onclick="hapusPerData(${index})">🗑️</button>
        </td>
      </tr>
    `;
  });
}

// === FUNGSI BARU: HAPUS PER DATA ===
window.hapusPerData = function(index){
  let nama = dataList[index].keterangan;
  if(confirm(`Yakin mau hapus data ${nama} ?`)){
    dataList.splice(index, 1);
    simpanKeFirebase();
  }
}

// === FUNGSI BARU: EDIT PER DATA ===
window.editData = function(index){
  let item = dataList[index];
  editIndex = index;
  
  // ISI KEMBALI FORM ATAS - SESUAIKAN SELECTOR INPUT LU
  // Contoh: input pertama 0,9 itu total SM
  document.querySelectorAll('input')[0].value = item.total_sm;
  document.querySelectorAll('input')[1].value = item.harga; // sesuaikan urutan

  // Ganti tombol jadi mode update
  document.getElementById('btnSimpan').innerText = `UPDATE DATA ${item.keterangan} ✏️`;
  document.getElementById('btnSimpan').style.background = "#FFC107";
  document.getElementById('btnBatal').style.display = "block";
  
  window.scrollTo({top: 0, behavior: 'smooth'});
}

window.batalEdit = function(){
  editIndex = null;
  resetForm();
  document.getElementById('btnSimpan').innerText = "SIMPAN DATA 🚀";
  document.getElementById('btnSimpan').style.background = "#00FF00";
  document.getElementById('btnBatal').style.display = "none";
}

function resetForm(){
  document.querySelectorAll('input').forEach(i => i.value = '');
}

window.hapusSemua = function(){
  if(confirm('Hapus SEMUA data?')){
    dataList = [];
    simpanKeFirebase();
  }
}

// LISTEN FIREBASE
onValue(ref(db, 'cng_monitor'), (snapshot) => {
  dataList = snapshot.val() || [];
  renderTable();
});

</script>
</body>
</html>
