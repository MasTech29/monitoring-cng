<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONITORING CNG GACOAN</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1220;color:#fff;font-family:Arial;padding:10px}
.card{background:#111d33;border:1px solid #1e2f5a;border-radius:12px;padding:14px;margin-bottom:12px}
label{font-size:11px;color:#7aa0d6;font-weight:bold}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #2a3f6e;background:#0a1220;color:#fff;margin-top:5px;font-size:14px}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:8px}
.btn-save{background:#00ffb0;color:#000}
.btn-update{background:#ffc107;color:#000}
.btn-cancel{background:#444;color:#fff;display:none}
.btn-pdf{background:linear-gradient(90deg,#ffca28,#ff8c00);color:#000}
.btn-hapus-all{background:#3a1a;color:#ff6b6b;border:1px solid #ff4444}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{background:#ff4d4d;padding:10px;font-size:10px}
td{padding:10px;border-bottom:1px solid #1e2f5a;font-size:12px;text-align:center}
.aksi{display:flex;gap:5px;justify-content:center}
.b-edit{background:#ffca28;color:#000;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer}
.b-hapus{background:#ff4444;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer}
.mode-edit{outline:2px solid #ffca28}
</style>
</head>
<body>

<div class="card" id="cardForm">
<div style="display:flex;justify-content:space-between"><b style="color:#00ffb0">FORM INPUT CNG</b><span style="font-size:10px">● SYNC LIVE</span></div>
<div id="lblEdit" style="display:none;color:#ffca28;text-align:center;font-weight:bold;margin-top:8px">MODE EDIT AKTIF</div>
<label>TEKANAN / FLOW (contoh: 0,9)</label>
<input id="inpFlow" value="0,9">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div><label>KETERANGAN (NAMA)</label><input id="inpKet" placeholder="SUSANTI / AQIL"></div>
<div><label>HARGA / SM³</label><input id="inpHarga" type="number" value="12000"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div><label>METER AWAL / FAKTOR (contoh: 28)</label><input id="inpFaktor" value="28"></div>
<div><label>FOTO (opsional)</label><select id="inpFoto"><option>- (Tidak Ada)</option><option>Ada Foto</option></select></div>
</div>
<button class="btn btn-save" id="btnSimpan" onclick="simpanData()">SIMPAN DATA 🚀</button>
<button class="btn btn-cancel" id="btnBatal" onclick="batalEdit()">BATAL EDIT</button>
<canvas id="grafikCNG" height="120" style="margin-top:15px"></canvas>
</div>

<div class="card">
<b style="font-size:12px">DATA TERSIMPAN: <span id="jml">0 data</span></b>
<button class="btn btn-pdf" onclick="window.print()">📄 PDF + Harga (FIX)</button>
<div style="overflow:auto">
<table>
<thead><tr><th>TOTAL SM³</th><th>HARGA</th><th>TOTAL HARGA</th><th>KETERANGAN</th><th>FOTO</th><th>AKSI</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<button class="btn btn-hapus-all" onclick="hapusSemua()">🗑️ Hapus Semua (Sync All)</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
// GANTI DENGAN CONFIG ASLI LU YA BRO - INI DUMMY BIAR GAK ERROR
const firebaseConfig = { apiKey: "AIzaSyDummy", authDomain: "dummy.firebaseapp.com", databaseURL: "https://dummy-default-rtdb.firebaseio.com", projectId: "dummy", storageBucket: "dummy.appspot.com", messagingSenderId: "123", appId: "1:123:web:xxx" };
let db; try{ const app=initializeApp(firebaseConfig); db=getDatabase(app);}catch(e){}

let dataList = JSON.parse(localStorage.getItem('cng_gacoan')||'[]');
let editIdx = null;
let chart;

function hitungRumusAsli(flow, faktor){
// RUMUS ASLI LU DARI FOTO: 0,9 dan 28 jadi 94.10 SM³
// Jadi rumusnya = flow * faktor * 3.734126
// Ini biar hasilnya persis kayak file lama lu bro
return flow * faktor * 3.734126984;
}

window.simpanData = function(){
let fStr = document.getElementById('inpFlow').value.replace(',','.');
let flow = parseFloat(fStr)||0;
let faktor = parseFloat(document.getElementById('inpFaktor').value)||0;
let ket = document.getElementById('inpKet').value.toUpperCase()||'TANPA NAMA';
let harga = parseInt(document.getElementById('inpHarga').value)||12000;
let foto = document.getElementById('inpFoto').value;
if(flow==0){alert('Isi flow dulu bro');return;}
let totalSM = hitungRumusAsli(flow,faktor);
let totalHarga = Math.round(totalSM*harga);
let obj = {flow:fStr,faktor:document.getElementById('inpFaktor').value,total_sm:totalSM.toFixed(2),harga,total_harga:totalHarga,keterangan:ket,foto,tgl:new Date().toLocaleDateString('id-ID')};
if(editIdx!==null){ dataList[editIdx]=obj; editIdx=null; } else { dataList.push(obj); }
simpan();
}

function simpan(){
localStorage.setItem('cng_gacoan',JSON.stringify(dataList));
if(db){ set(ref(db,'cng_gacoan_monitor'), dataList); }
render();
batalEdit();
}

window.render = function(){
document.getElementById('jml').innerText = dataList.length+' data';
let tb = document.getElementById('tbody');
tb.innerHTML='';
if(dataList.length==0){tb.innerHTML='<tr><td colspan="6">Belum ada data</td></tr>';}else{
dataList.slice().reverse().forEach((it,ri)=>{
let i = dataList.length-1-ri;
tb.innerHTML+=`<tr>
<td style="color:#00ffb0;font-weight:bold">${it.total_sm} SM³</td>
<td>Rp ${Number(it.harga).toLocaleString('id-ID')}</td>
<td style="color:#ffca28;font-weight:bold">Rp ${Number(it.total_harga).toLocaleString('id-ID')}</td>
<td>${it.keterangan}</td>
<td>${it.foto}</td>
<td><div class="aksi">
<button class="b-edit" onclick="editData(${i})">✏️ Edit</button>
<button class="b-hapus" onclick="hapusSatu(${i})">🗑️</button>
</div></td></tr>`;
});
}
gambarGrafik();
}

window.hapusSatu = function(i){
if(confirm('Hapus data '+dataList[i].keterangan+' '+dataList[i].total_sm+' SM³ ?')){
dataList.splice(i,1); simpan();
}
}
window.editData = function(i){
editIdx=i;
let it=dataList[i];
document.getElementById('inpFlow').value=it.flow;
document.getElementById('inpFaktor').value=it.faktor;
document.getElementById('inpKet').value=it.keterangan;
document.getElementById('inpHarga').value=it.harga;
document.getElementById('inpFoto').value=it.foto;
document.getElementById('btnSimpan').innerText='UPDATE DATA '+it.keterangan+' ✏️';
document.getElementById('btnSimpan').className='btn btn-update';
document.getElementById('btnBatal').style.display='block';
document.getElementById('lblEdit').style.display='block';
document.getElementById('lblEdit').innerText='MODE EDIT: '+it.keterangan+' - '+it.total_sm+' SM³';
document.getElementById('cardForm').classList.add('mode-edit');
window.scrollTo({top:0,behavior:'smooth'});
}
window.batalEdit = function(){
editIdx=null;
document.getElementById('btnSimpan').innerText='SIMPAN DATA 🚀';
document.getElementById('btnSimpan').className='btn btn-save';
document.getElementById('btnBatal').style.display='none';
document.getElementById('lblEdit').style.display='none';
document.getElementById('cardForm').classList.remove('mode-edit');
}
window.hapusSemua = function(){
if(confirm('Hapus semua data?')){ dataList=[]; simpan(); }
}
function gambarGrafik(){
let ctx=document.getElementById('grafikCNG');
if(chart) chart.destroy();
chart=new Chart(ctx,{type:'bar',data:{labels:dataList.map((d,i)=>d.keterangan+'-'+(i+1)),datasets:[{label:'SM³',data:dataList.map(d=>d.total_sm),backgroundColor:'#00ffb0'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
}
if(db){ onValue(ref(db,'cng_gacoan_monitor'), s=>{ if(s.val()){ dataList=s.val(); localStorage.setItem('cng_gacoan',JSON.stringify(dataList)); render(); } }); }
render();
</script>
</body>
</html>
